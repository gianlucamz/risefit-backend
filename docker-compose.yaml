version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: risefit_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: aluno
      MYSQL_DATABASE: risefit
      MYSQL_USER: root
      MYSQL_PASSWORD: aluno
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: